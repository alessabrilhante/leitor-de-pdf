<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Folha">
  <title>Folha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Biblioteca -->
  <main id="library" class="library">
    <header class="lib-head">
      <h1>Folha</h1>
      <label class="btn-add">
        <input id="file" type="file" accept="application/pdf,.pdf" hidden>
        <span>Adicionar PDF</span>
      </label>
    </header>

    <p id="empty" class="empty" hidden>
      Sua estante está vazia.<br>
      Toque em <strong>Adicionar PDF</strong> e escolha um arquivo.
    </p>

    <ul id="books" class="books"></ul>

    <p class="hint">Os livros ficam só neste aparelho. Nada é enviado pra internet.</p>
  </main>

  <!-- Leitura -->
  <section id="reader" class="reader" hidden>
    <div id="stage" class="stage"></div>

    <div id="loading" class="loading" hidden>Abrindo…</div>

    <div id="bar-top" class="bar bar-top">
      <button id="back" class="bar-btn" type="button">‹ Estante</button>
      <span id="title" class="bar-title"></span>
    </div>

    <div id="bar-bottom" class="bar bar-bottom">
      <input id="slider" type="range" min="1" max="1" value="1" aria-label="Ir para a página">
      <div class="bar-row">
        <button id="fit" class="bar-btn" type="button"></button>
        <span id="counter" class="counter"></span>
        <button id="theme" class="bar-btn" type="button"></button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
