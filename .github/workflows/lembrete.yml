name: Lembrete de leitura

# Roda de hora em hora e manda o lembrete pros aparelhos cujo horário escolhido é agora
# (horário de Brasília). "Run workflow" manda pra todos na hora, pra testar.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3
      - run: node lembrete/enviar.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          LEMBRETE_ASSINATURAS: ${{ secrets.LEMBRETE_ASSINATURAS }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' }}
